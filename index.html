<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Dos Caras</title>
    <meta name="description" content="Explora las dos caras de la moneda en los temas politicos mas relevantes." />
    <!-- Anti-FOUC: aplica dark antes de que React monte la UI -->
    <script>
      (function(){
        var t=localStorage.getItem('lasdoscaras_theme');
        if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches)){
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
